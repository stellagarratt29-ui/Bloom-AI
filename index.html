<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bloom</title>
</head>
<body style="margin:0; background:#FAF8F4; font-family:sans-serif;">
  <p id="status" style="text-align:center; padding:40px; color:#8A9B8C; font-size:16px;">Loading Bloom...</p>
  <div id="root" style="position:fixed; top:0; left:0; right:0; bottom:0; display:flex;"></div>
  <script>
    var errorMsg = null;
    window.onerror = function(msg, src, line, col, err) {
      errorMsg = 'Error: ' + msg + '\nLine: ' + line + (err ? '\n' + err.stack : '');
      document.getElementById('status').style.color = '#c0392b';
      document.getElementById('status').style.whiteSpace = 'pre-wrap';
      document.getElementById('status').style.fontSize = '12px';
      document.getElementById('status').style.textAlign = 'left';
      document.getElementById('status').style.padding = '20px';
      document.getElementById('status').textContent = errorMsg;
      return true;
    };
    window.addEventListener('unhandledrejection', function(e) {
      errorMsg = 'Promise Error: ' + e.reason;
      document.getElementById('status').style.color = '#c0392b';
      document.getElementById('status').textContent = errorMsg;
    });
  </script>
  <script src="_expo/static/js/web/index-b4dabeb7c23c0ed7deca803ec9016203.js"
    onerror="document.getElementById('status').textContent='File not found (404)'"
    onload="if(!errorMsg) document.getElementById('status').textContent='Loaded OK — React did not render'"></script>
</body>
</html>
