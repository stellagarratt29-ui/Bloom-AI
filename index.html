<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bloom</title>
</head>
<body style="margin:0; background:#FAF8F4; font-family:sans-serif;">
  <p id="status" style="text-align:center; padding:40px; color:#8A9B8C; font-size:16px;">Loading Bloom...</p>
  <div id="root" style="position:fixed; top:0; left:0; right:0; bottom:0; display:flex;"></div>
  <script>
    window.onerror = function(msg, src, line) {
      document.getElementById('status').style.color = '#c0392b';
      document.getElementById('status').textContent = 'JS Error: ' + msg + ' (line ' + line + ')';
      return true;
    };
  </script>
  <script src="_expo/static/js/web/index-9224ff38cae2c6d6ea956ce1b9a25d47.js"
    onerror="document.getElementById('status').textContent='File not found (404) — wrong path'"
    onload="document.getElementById('status').textContent='File loaded but app crashed'"></script>
</body>
</html>
